name = "mppt-api"
main = "src/index.js"
compatibility_date = "2024-05-29"

workers_dev = true

# ── R2 Bucket (Manuscript Storage) ──
[[r2_buckets]]
binding = "MANUSCRIPTS"
bucket_name = "mppt-manuscripts"

# ── D1 Database (Editorial Workflow) ──
[[d1_databases]]
binding = "DB"
database_name = "mppt-editorial"
database_id = "" # Fill after: wrangler d1 create mppt-editorial

# ── Workers AI (Conversational Bot + Plagiarism) ──
[ai]
binding = "AI"

# ── Environment Variables ──
# Set secrets via: wrangler secret put <KEY>
# TELEGRAM_BOT_TOKEN = "8902857493:AAGtxErtlIblN2aeFgwnm65K7yw8tABEfqk"
# TELEGRAM_GROUP_ID  = "-1004291559247"
# ZOHO_SMTP_USER     = "review@mpptjournal.com"
# ZOHO_SMTP_PASS     = ""
# ZOHO_EDITOR_USER   = "editor@mpptjournal.com"
# ZOHO_EDITOR_PASS   = ""
# RAZORPAY_KEY_ID    = ""
# RAZORPAY_KEY_SECRET = ""
# ZENODO_API_TOKEN   = ""
# ZENODO_SANDBOX     = "false"

[vars]
JOURNAL_NAME = "Journal of Modern Pharmacy Praxis & Therapeutics"
JOURNAL_SHORT = "MPPT Journal"
JOURNAL_URL = "https://mpptjournal.com"
CURRENT_VOLUME = "1"
CURRENT_ISSUE = "1"
TELEGRAM_GROUP_ID = "-1004291559247"

# ── Cron Triggers (Deadline Monitoring) ──
# [triggers]
# crons = ["0 */6 * * *"]  # Every 6 hours — check deadlines, send alerts


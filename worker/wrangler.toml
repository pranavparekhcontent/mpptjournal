name = "mppt-api"
main = "src/index.js"
compatibility_date = "2024-05-29"

workers_dev = true

# ── R2 Bucket (Manuscript Storage) ──
[[r2_buckets]]
binding = "MANUSCRIPTS"
bucket_name = "mppt-manuscripts"

# ── D1 Database (Editorial Workflow) ──
[[d1_databases]]
binding = "DB"
database_name = "mppt-editorial"
database_id = "b9b4fb91-f3d3-46b5-908b-d845104227d0"

# ── Workers AI (Conversational Bot + Plagiarism) ──
[ai]
binding = "AI"

[vars]
JOURNAL_NAME = "Journal of Modern Pharmacy Praxis & Therapeutics"
JOURNAL_SHORT = "MPPT Journal"
JOURNAL_URL = "https://mpptjournal.com"
CURRENT_VOLUME = "1"
CURRENT_ISSUE = "1"
TELEGRAM_GROUP_ID = "-1004291559247"
TELEGRAM_BOT_TOKEN = "8902857493:AAGtxErtlIblN2aeFgwnm65K7yw8tABEfqk"

# ── Cron Triggers (Deadline Monitoring) ──
